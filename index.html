<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111820" />
    <link rel="icon" href="data:," />
    <meta
      name="description"
      content="竹知了互动声景：连续点击或持续按住竹知了，让夏日鸣响随转速逐渐增强。"
    />
    <title>夏鸣 · 竹知了</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <canvas id="scene" aria-label="连续点击或按住即可加速转动的竹知了互动场景"></canvas>

    <header class="brand" aria-label="夏鸣竹知了">
      <span class="brand__eyebrow">夏日声景 · 其一</span>
      <h1>竹知了</h1>
      <p>一圈，一声夏</p>
    </header>

    <section class="readout" aria-live="polite">
      <span class="readout__value" id="speedValue">0.0</span>
      <span class="readout__unit">圈 / 秒</span>
      <span class="readout__rule" aria-hidden="true"></span>
      <span class="readout__count"><b id="wahCount">0</b> 次鸣响</span>
    </section>

    <nav class="controls" aria-label="互动控制">
      <button
        class="icon-button is-active"
        id="soundButton"
        type="button"
        aria-pressed="true"
        aria-label="关闭声音"
        data-tooltip="声音"
      >
        <span aria-hidden="true">♪</span>
      </button>
      <button
        class="icon-button"
        id="autoButton"
        type="button"
        aria-pressed="false"
        aria-label="开始自动演示"
        data-tooltip="自动演示"
      >
        <span aria-hidden="true">↻</span>
      </button>
    </nav>

    <div class="gesture" id="gesture">点击即可转动竹知了~</div>

    <button class="audio-gate is-hidden" id="audioGate" type="button">唤醒夏声</button>

    <footer class="credit">
      <span>天问原创程序化声源</span>
      <span aria-hidden="true">·</span>
      <span>Canvas + Web Audio</span>
    </footer>

    <noscript>此互动需要启用 JavaScript。</noscript>
    <script src="./app.js" defer></script>
  </body>
</html>
